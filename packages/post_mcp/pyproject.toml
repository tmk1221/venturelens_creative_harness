[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post_mcp"
version = "0.1.0"
description = "MCP server for the VentureLens Creative Harness: transcript-first video editing for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "post_core",
    "opentimelineio>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
post-mcp = "post_mcp.server:main"

[tool.setuptools.packages.find]
include = ["post_mcp*"]
