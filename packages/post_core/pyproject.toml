[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post_core"
version = "0.1.0"
description = "Post v3 headless core: data model, content-addressed build graph, queue, workers."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
export = [
    "opentimelineio>=0.18",
]

[project.scripts]
post = "post_core.cli.main:main"

[tool.setuptools.packages.find]
include = ["post_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
